# -------------------------------
# Navigation Menu
# -------------------------------
header_pages:
  - index.markdown
  - about.markdown
  - group.markdown
  - publication.markdown
  - patent.markdown
  - teaching/index.markdown

# -------------------------------
# Sitemap / SEO
# -------------------------------
defaults:
  - scope:
      path: ""
    values:
      sitemap: true

# -------------------------------
# Exclusions
# -------------------------------
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md

# ===========================================================
