# -------------------------------
# Basic Site Information
# -------------------------------
title: Home
seo_title: "Manjunath Prasad H. R. — Assistant Professor and Researcher in Computer Vision, Deep Learning, and AI"
email: manjunathprasad99@gmail.com
author: "Manjunath Prasad Holenarasipura Rajiv"
description: "Personal website of Manjunath Prasad H. R., Assistant Professor at Nitte (Deemed to be University). His research focuses on Machine Learning, Deep Learning, Computer Vision, Vision-Language Models, and Cloud-AI Integration."
keywords: "Manjunath Prasad, Manjunath Prasad H. R., Manjunath Prasad Nitte, Holenarasipura, Nitte, Nitte (Deemed to be University), nipe, Assistant Professor, Computer Vision, Deep Learning, Machine Learning, Vision-Language Models, Cloud AI, Researcher India, Nitte University, AI Researcher, Academic Profile"

# -------------------------------
# URL and Base Settings
# -------------------------------
baseurl: "/manjunathprasad"  # the subpath of your site, e.g. /blog
url: "https://manjunathprasad.github.io"  # your GitHub Pages domain (use HTTPS)

# -------------------------------
# Theme and Plugins
# -------------------------------
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# -------------------------------
# Include Folders (for static access)
# -------------------------------
include:
  - Downloads
  - Downloads/01-09-2025
  - Downloads/01-21-2025
  - Downloads/01-22-2025
  - Downloads/Syllabus
  - Downloads/01-28-2025
  - Downloads/01-29-2025
  - Downloads/01-30-2025
  - Downloads/02-06-2025
  - Downloads/02-10-2025
  - Downloads/02-13-2025
  - Downloads/03-05-2025
  - Downloads/03-12-2025
  - Downloads/03-18-2025
  - Downloads/03-19-2025
  - Downloads/03-20-2025
  - Downloads/04-01-2025
  - Downloads/04-03-2025
  - Downloads/04-09-2025
  - Downloads/04-10-2025
  - Downloads/04-15-2025
  - _includes/footer.html

# -------------------------------
# Navigation Order (Header Menu)
# -------------------------------
header_pages:
  - index.markdown
  - about.markdown
  - group.markdown
  - publication.markdown
  - patent.markdown
  - teaching/index.markdown

# -------------------------------
# Sitemap Settings (for Google)
# -------------------------------
defaults:
  - scope:
      path: ""
    values:
      sitemap: true

# -------------------------------
# Exclusions (not processed)
# -------------------------------
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md

# ===========================================================
# END OF CONFIGURATION
# ===========================================================
