  - Downloads/Syllabus
  - Downloads/01-28-2025
  - Downloads/01-29-2025
  - Downloads/01-30-2025
  - Downloads/02-06-2025
  - Downloads/02-10-2025
  - Downloads/02-13-2025
  - Downloads/03-05-2025
  - Downloads/03-12-2025
  - Downloads/03-18-2025
  - Downloads/03-19-2025
  - Downloads/03-20-2025
  - Downloads/04-01-2025
  - Downloads/04-03-2025
  - Downloads/04-09-2025
  - Downloads/04-10-2025
