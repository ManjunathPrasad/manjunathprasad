# -------------------------------
# Theme and Plugins
# -------------------------------
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# -------------------------------
# Include Folders (for static access)
# -------------------------------
include:
  - Downloads
