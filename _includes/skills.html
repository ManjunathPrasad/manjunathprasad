<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Skills Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
            pointer-events: none;
            font-size: 14px;
        }

        svg {
            width: 100vw;
            height: 100vh;
        }

        .node {
            stroke: white;
            stroke-width: 1px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script>
    const width = window.innerWidth, height = window.innerHeight;

    const skillsData = [
        { id: "Machine Learning", skills: ["Python", "NumPy", "matplotlib", "PyTorch"] },
        { id: "Cloud", skills: ["Azure", "AWS"] },
        { id: "Web Development", skills: ["C#.NET", "ASP.NET MVC Core", "ASP.NET Web API", "Razor Pages"] },
        { id: "Databases", skills: ["MongoDB", "MS SQL Server"] },
        { id: "Version Control", skills: ["Git", "Azure DevOps", "BitBucket"] },
        { id: "Typesetting", skills: ["LaTeX", "MS-Word"] }
    ];

    const links = [
        { source: "Machine Learning", target: "Cloud" },
        { source: "Cloud", target: "Web Development" },
        { source: "Web Development", target: "Databases" },
        { source: "Databases", target: "Version Control" },
        { source: "Version Control", target: "Typesetting" },
        { source: "Typesetting", target: "Machine Learning" }
    ];

    const svg = d3.select("svg");

    const simulation = d3.forceSimulation(skillsData)
        .force("link", d3.forceLink(links).id(d => d.id).distance(150))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(50))
        .force("x", d3.forceX().strength(0.02))  // Gentle horizontal force
        .force("y", d3.forceY().strength(0.02))  // Gentle vertical force
        .on("tick", ticked);

    const link = svg.selectAll(".link")
        .data(links)
        .enter()
        .append("line")
        .attr("stroke", "#888")
        .attr("stroke-width", 2);

    const node = svg.selectAll(".node")
        .data(skillsData)
        .enter()
        .append("circle")
        .attr("r", 50)
        .attr("class", "node")
        .style("fill", d => `url(#grad-${d.id.replace(/\s+/g, '')})`)
        .call(d3.drag()
            .on("start", dragStarted)
            .on("drag", dragged)
            .on("end", dragEnded))
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip);

    const text = svg.selectAll(".text")
        .data(skillsData)
        .enter()
        .append("text")
        .attr("text-anchor", "middle")
        .attr("fill", "white")
        .attr("font-size", "14px")
        .attr("font-weight", "bold")
        .text(d => d.id);

    function ticked() {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x += (Math.random() - 0.5) * 0.5) // Add slight movement
            .attr("cy", d => d.y += (Math.random() - 0.5) * 0.5);

        text
            .attr("x", d => d.x)
            .attr("y", d => d.y + 5);
    }

    function dragStarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragEnded(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

    function showTooltip(event, d) {
        const tooltip = document.getElementById("tooltip");
        tooltip.style.left = (event.pageX + 10) + "px";
        tooltip.style.top = (event.pageY + 10) + "px";
        tooltip.innerHTML = `<strong>${d.id}</strong><br>${d.skills.join(", ")}`;
        tooltip.style.display = "block";
    }

    function hideTooltip() {
        document.getElementById("tooltip").style.display = "none";
    }

    // Define gradients for nodes
    const defs = svg.append("defs");
    skillsData.forEach(skill => {
        const gradient = defs.append("radialGradient")
            .attr("id", `grad-${skill.id.replace(/\s+/g, '')}`)
            .attr("cx", "50%")
            .attr("cy", "50%")
            .attr("r", "50%");
        
        gradient.append("stop").attr("offset", "0%").attr("stop-color", "white");
        gradient.append("stop").attr("offset", "100%").attr("stop-color", "blue");
    });

</script>

</body>
</html>
